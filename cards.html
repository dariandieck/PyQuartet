<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#182030" />
    <meta name="description" content="All PyQuartet cards: the Python libraries behind ML pipelines, searchable." />
    <link rel="icon" type="image/png" href="/data/favicon.png" />
    <title>PyQuartet cards</title>
  </head>
  <body>
    <header class="top">
      <div class="bar">
        <a class="back" href="./">← Back to the game</a>
        <h1><span class="py">Py</span>Quartet cards</h1>
      </div>
      <div class="center">
        <div class="search-row">
          <input
            type="search"
            id="search"
            placeholder="Search name, package, keyword or description"
            aria-label="Search cards"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
          />
          <label class="sort">
            <span>Sort by</span>
            <select id="sort-key">
              <option value="match">Best match</option>
              <option value="name">Name</option>
            </select>
          </label>
          <button type="button" id="sort-dir" class="sort-dir" disabled></button>
        </div>
        <div class="meta">
          <span id="count" role="status"></span>
          <label class="toggle">
            <input type="checkbox" id="exact" />
            <span class="switch" aria-hidden="true"></span>
            Exact values
          </label>
          <span id="values-note">Rounded as in the game</span>
        </div>
        <p class="note">
          Clone <a id="repo-link" href="https://github.com/dariandieck/PyQuartet" target="_blank" rel="noopener">this repo</a>
          and use the editor to change/delete/add cards.
        </p>
      </div>
    </header>

    <main id="grid" class="grid"></main>
    <p id="empty" class="empty" hidden>No card matches your search.</p>

    <script type="module" src="/src/gallery/main.ts"></script>
  </body>
</html>
